# ══════════════════════════════════════════════════════════════════════════════
# KKMNow Frontend — GitLab CI/CD Pipeline
# ══════════════════════════════════════════════════════════════════════════════
#
# Branch strategy:
#   - MR to any branch  → lint + typecheck (quality gate)
#   - Push to staging    → build → push → deploy staging → verify
#   - Push to main       → build → push → deploy production (manual) → verify
#
# Required GitLab CI/CD variables (Settings > CI/CD > Variables):
#   AWS_DEFAULT_REGION          — ap-southeast-5
#   ECR_REGISTRY                — 624693141495.dkr.ecr.ap-southeast-5.amazonaws.com
#   NEXT_PUBLIC_API_URL         — Backend API endpoint
#   NEXT_PUBLIC_APP_URL         — Frontend public URL
#   NEXT_PUBLIC_S3_URL          — CloudFront URL for datasets
#   NEXT_PUBLIC_I18N_URL        — CloudFront URL for i18n
#   NEXT_PUBLIC_APP_ENV         — "staging" or "production" (scoped per environment)
#   NEXT_PUBLIC_API_KEY         — API key (protected + masked)
#   NEXT_PUBLIC_AUTHORIZATION_TOKEN — Auth token (protected + masked)
#   NEXT_PUBLIC_GA_TAG          — Google Analytics
#   NEXT_PUBLIC_MIXPANEL_TOKEN  — Mixpanel
#   NEXT_PUBLIC_TINYBIRD_TOKEN  — Tinybird
#   NEXT_PUBLIC_TINYBIRD_URL    — Tinybird API URL
#   NEXT_PUBLIC_TILESERVER_URL  — Map tile server URL
#   CF_DISTRIBUTION_ID          — CloudFront distribution (scoped per environment)
#   HEALTH_CHECK_URL            — Public URL for smoke tests (scoped per environment)
#
# AWS credentials: NOT required — GitLab runner uses EC2 instance profile.
#
# Rollback:
#   aws ecs update-service --cluster <cluster> --service <service> \
#     --task-definition kkmnow-frontend-staging:<previous-revision> \
#     --region ap-southeast-5
# ══════════════════════════════════════════════════════════════════════════════

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  AWS_DEFAULT_REGION: ap-southeast-5
  ECR_REGISTRY: 624693141495.dkr.ecr.ap-southeast-5.amazonaws.com
  ECR_REPOSITORY: kkmnow-frontend
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

stages:
  - quality
  - build-and-push
  - deploy
  - verify
  - load-test

# ══════════════════════════════════════════════════════════════════════════════
# Stage: quality — runs on every MR
# ══════════════════════════════════════════════════════════════════════════════

lint:
  stage: quality
  tags:
    - aws-medium
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - .yarn/cache/
    policy: pull-push
  before_script:
    - yarn install --frozen-lockfile --network-timeout 600000
  script:
    - npx turbo run lint --filter=kkmnow

typecheck:
  stage: quality
  tags:
    - aws-medium
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - .yarn/cache/
    policy: pull
  before_script:
    - yarn install --frozen-lockfile --network-timeout 600000
  script:
    - npx tsc --noEmit --project apps/kkmnow/tsconfig.json
  allow_failure: true  # Remove once all TS errors are fixed

# ══════════════════════════════════════════════════════════════════════════════
# Stage: build-and-push — Docker build + ECR push in a single job
# ══════════════════════════════════════════════════════════════════════════════

build-and-push:
  stage: build-and-push
  tags:
    - aws-medium
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    # Install AWS CLI in Docker image (lightweight method)
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION |
      docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    # Pull previous image for Docker layer cache (best-effort)
    - docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest || true
    # Build with cache-from for faster rebuilds
    - |
      docker build \
        --platform linux/amd64 \
        -f apps/kkmnow/Dockerfile \
        --cache-from "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
        --build-arg "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" \
        --build-arg "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" \
        --build-arg "NEXT_PUBLIC_S3_URL=$NEXT_PUBLIC_S3_URL" \
        --build-arg "NEXT_PUBLIC_APP_ENV=$NEXT_PUBLIC_APP_ENV" \
        --build-arg "NEXT_PUBLIC_API_KEY=$NEXT_PUBLIC_API_KEY" \
        --build-arg "NEXT_PUBLIC_AUTHORIZATION_TOKEN=$NEXT_PUBLIC_AUTHORIZATION_TOKEN" \
        --build-arg "NEXT_PUBLIC_GA_TAG=$NEXT_PUBLIC_GA_TAG" \
        --build-arg "NEXT_PUBLIC_MIXPANEL_TOKEN=$NEXT_PUBLIC_MIXPANEL_TOKEN" \
        --build-arg "NEXT_PUBLIC_TINYBIRD_TOKEN=$NEXT_PUBLIC_TINYBIRD_TOKEN" \
        --build-arg "NEXT_PUBLIC_TINYBIRD_URL=$NEXT_PUBLIC_TINYBIRD_URL" \
        --build-arg "NEXT_PUBLIC_TILESERVER_URL=$NEXT_PUBLIC_TILESERVER_URL" \
        --build-arg "NEXT_PUBLIC_I18N_URL=$NEXT_PUBLIC_I18N_URL" \
        -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
        -t "$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_BRANCH" \
        .
    # Push commit-tagged image (immutable reference for rollback)
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    # Push branch-tagged image (mutable, used as cache source + latest deploy)
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_BRANCH"
    # Tag summary
    - echo "Pushed $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    - echo "Pushed $ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_BRANCH"

# ══════════════════════════════════════════════════════════════════════════════
# Stage: deploy — ECS rolling deployment
# ══════════════════════════════════════════════════════════════════════════════

.deploy_template: &deploy_template
  stage: deploy
  tags:
    - aws-large
  image:
    name: amazon/aws-cli:2.22
    entrypoint: [""]
  script:
    # Force new deployment to pull latest image
    - |
      echo "Deploying $IMAGE_TAG to $ECS_SERVICE on cluster $ECS_CLUSTER..."
      aws ecs update-service \
        --cluster $ECS_CLUSTER \
        --service $ECS_SERVICE \
        --force-new-deployment \
        --region $AWS_DEFAULT_REGION
    # Wait for service to stabilize (timeout: 10 min via waiter default)
    - |
      echo "Waiting for service to stabilize..."
      aws ecs wait services-stable \
        --cluster $ECS_CLUSTER \
        --services $ECS_SERVICE \
        --region $AWS_DEFAULT_REGION
    - echo "Deployment complete — service is stable."
  dependencies: []

deploy_staging:
  <<: *deploy_template
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  needs:
    - job: build-and-push
      artifacts: false
  environment:
    name: staging
    url: https://$HEALTH_CHECK_URL
  variables:
    ECS_CLUSTER: kkmnow-staging
    ECS_SERVICE: kkmnow-frontend-staging

deploy_production:
  <<: *deploy_template
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false  # Block verify until manually approved
  needs:
    - job: build-and-push
      artifacts: false
  environment:
    name: production
    url: https://$HEALTH_CHECK_URL
  variables:
    ECS_CLUSTER: kkmnow-production
    ECS_SERVICE: kkmnow-frontend-production

# ══════════════════════════════════════════════════════════════════════════════
# Stage: verify — CloudFront invalidation + smoke tests
# ══════════════════════════════════════════════════════════════════════════════

.verify_template: &verify_template
  stage: verify
  tags:
    - aws-medium
  image:
    name: amazon/aws-cli:2.22
    entrypoint: [""]
  retry:
    max: 1
    when:
      - script_failure
  before_script:
    - yum install -y curl > /dev/null 2>&1 || true
  script:
    # ── CloudFront cache invalidation ──
    - |
      if [ -n "$CF_DISTRIBUTION_ID" ]; then
        INVALIDATION_ID=$(aws cloudfront create-invalidation \
          --distribution-id $CF_DISTRIBUTION_ID \
          --paths "/*" \
          --region us-east-1 \
          --query 'Invalidation.Id' \
          --output text)
        echo "CloudFront invalidation created: $INVALIDATION_ID"
      else
        echo "⚠ CF_DISTRIBUTION_ID not set — skipping CloudFront invalidation"
      fi
    # ── Smoke test: health check ──
    - |
      if [ -n "$HEALTH_CHECK_URL" ]; then
        echo "Running health check against $HEALTH_CHECK_URL..."
        for i in $(seq 1 18); do
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            "$HEALTH_CHECK_URL/api/health" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Health check passed (attempt $i/18)"
            break
          fi
          echo "  Waiting for healthy response... (attempt $i/18, got HTTP $HTTP_CODE)"
          sleep 10
        done
        if [ "$HTTP_CODE" != "200" ]; then
          echo "✗ Health check failed after 3 minutes"
          exit 1
        fi
      else
        echo "⚠ HEALTH_CHECK_URL not set — skipping smoke test"
      fi
    # ── Smoke test: homepage returns 200 ──
    - |
      if [ -n "$HEALTH_CHECK_URL" ]; then
        HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
          -u "${BASIC_AUTH_USER:-admin}:${BASIC_AUTH_PASS:-skip}" \
          "$HEALTH_CHECK_URL/" 2>/dev/null || echo "000")
        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
          echo "✓ Homepage reachable (HTTP $HTTP_CODE)"
        else
          echo "✗ Homepage returned unexpected HTTP $HTTP_CODE"
          exit 1
        fi
      fi
  dependencies: []

verify_staging:
  <<: *verify_template
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  needs:
    - job: deploy_staging
  environment:
    name: staging
    action: verify

verify_production:
  <<: *verify_template
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - job: deploy_production
  environment:
    name: production
    action: verify

# ══════════════════════════════════════════════════════════════════════════════
# Stage: load-test — k6 load testing (manual trigger, post-deploy)
# ══════════════════════════════════════════════════════════════════════════════
# Runs k6 on a large runner to generate real load against the deployed service.
# Results are saved as JSON artifacts for review.
#
# Required CI/CD variables:
#   LOAD_TEST_BASE_URL  — target URL (e.g., CloudFront or ALB endpoint)
#   LOAD_TEST_AUTH_USER — Basic Auth user (default: admin)
#   LOAD_TEST_AUTH_PASS — Basic Auth password
#
# Optional overrides via CI/CD variables:
#   K6_VUS             — max virtual users (overrides stages in script)
#   K6_DURATION        — test duration (overrides stages in script)

.load_test_template: &load_test_template
  stage: load-test
  tags:
    - aws-large
  image:
    name: grafana/k6:0.55.0
    entrypoint: [""]
  when: manual
  allow_failure: true  # Load test failure should not block the pipeline
  script:
    - |
      echo "═══════════════════════════════════════════════"
      echo "  k6 Load Test — $CI_ENVIRONMENT_NAME"
      echo "  Target: $LOAD_TEST_BASE_URL"
      echo "═══════════════════════════════════════════════"
    - |
      k6 run scripts/k6-load-test.js \
        -e BASE_URL="$LOAD_TEST_BASE_URL" \
        -e AUTH_USER="${LOAD_TEST_AUTH_USER:-admin}" \
        -e AUTH_PASS="$LOAD_TEST_AUTH_PASS" \
        -e K6_REPORT_PATH="load-test-report.json" \
        ${K6_VUS:+--vus $K6_VUS} \
        ${K6_DURATION:+--duration $K6_DURATION} \
        || true
    - |
      echo ""
      echo "Full report saved to load-test-report.json"
      if [ -f load-test-report.json ]; then
        cat load-test-report.json
      fi
  artifacts:
    paths:
      - load-test-report.json
    expire_in: 30 days
    when: always
  dependencies: []

load_test_staging:
  <<: *load_test_template
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: manual
  needs:
    - job: verify_staging
  environment:
    name: staging
    action: verify
  variables:
    LOAD_TEST_BASE_URL: ${HEALTH_CHECK_URL:-https://d1zofdcmpfqbdi.cloudfront.net}

load_test_production:
  <<: *load_test_template
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - job: verify_production
  environment:
    name: production
    action: verify
  variables:
    LOAD_TEST_BASE_URL: ${HEALTH_CHECK_URL:-https://data.moh.gov.my}
